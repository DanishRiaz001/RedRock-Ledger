<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable stays enabled (not "no") on purpose: the iOS app wraps
         this same desktop-width layout verbatim (no separate mobile build),
         so pinch-zoom is how a phone-sized screen actually reaches content
         that's wider than the viewport. Harmless on desktop browsers, which
         don't have a pinch/double-tap zoom gesture to begin with. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Redrock Danria Accountants</title>
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"/>
    <style>
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
      body{margin:0;padding:0;background:#F5F9FA;font-family:system-ui,-apple-system,sans-serif;}
      input,select,button{font-family:inherit;}
      ::-webkit-scrollbar{display:none;}
      .rr-table-row,.rr-reskontro-row{transition:background .12s ease;}
      .rr-table-row:hover,.rr-table-row:active,.rr-reskontro-row:hover,.rr-reskontro-row:active{background:#E6F4F1!important;}
      .ti{vertical-align:-2px;}
      table{font-variant-numeric:tabular-nums;}
      .rr-sticky-thead thead tr{position:sticky;top:58px;z-index:5;box-shadow:0 1px 0 rgba(0,0,0,0.04);}
      .rr-sidebar-item:hover{background:#F5F9FA;}
      .rr-sidebar-item .rr-sidebar-pin{opacity:0;transition:opacity .12s ease;}
      .rr-sidebar-item:hover .rr-sidebar-pin{opacity:1;}
      body.rr-panel-resizing{cursor:col-resize!important;user-select:none!important;}
      body.rr-panel-resizing *{user-select:none!important;}
      body.rr-panel-resizing img{transition:none!important;}
      .rr-glass-btn{
        background:rgba(255,255,255,0.45);
        border:1px solid #E4EDED;
        backdrop-filter:blur(8px);
        -webkit-backdrop-filter:blur(8px);
        color:#1F2937;
        transition:background .15s ease,border-color .15s ease;
      }
      .rr-glass-btn:hover{background:#FFFFFF;border-color:#D1E2E2;}
      .rr-glass-card{
        background:rgba(255,255,255,0.75);
        backdrop-filter:blur(12px);
        -webkit-backdrop-filter:blur(12px);
        border:1px solid #E4EDED;
      }
      .rr-btn-primary{
        background:#FF5A1F;
        color:#fff;
        border:none;
        box-shadow:0 1px 0 rgba(255,255,255,0.25) inset, 0 2px 6px rgba(255,90,31,0.25);
        transition:background .15s ease;
      }
      .rr-btn-primary:hover{background:#E04810;}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
